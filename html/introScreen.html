<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bunker Survival!</title>
    <script src="api.js"></script>
    <script src="events.js"></script>
  </head>
  <body>
    <h1>Choose your difficulty!</h1>
    <div class="difficultyButtons">
      <button>Easy</button>
      <button>Medium</button>
      <button>Hard</button>
    </div>

    <div class="creditSelect">
        <p id="credits">credits - xxx</p>
        <p>Rations - 1 Credit</p>
        <button>+ 1 Rations</button>
        <button>- 1 Rations</button>
        <p>Water - 1 Credit</p>
        <button>+ 1 Water</button>
        <button>-1 Water</button>
        <h2>Other Items: </h2>
        <p>Radio - 5 credits</p>
        <button>Take Radio</button>
        <p>Map - 3 credits</p>
        <button>Take Map</button>


    </div>
  </body>
</html>
