
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journal of Events</title>
    <script src="../javascript/api.js" defer></script>
    <script src="../javascript/journal.js" defer></script>
    <link rel="stylesheet" href="../css/journal.css">
</head>

<body>

    <div class="container">

        <h1>Journal of Events</h1>

        <div class="journal">

            <div class="left">
                <h2>Journal Entry</h2>

                <p class="description">
                    Your event description will go here.
                    This is where players will read
                    what is happening in the bunker.
                </p>
            </div>

            <div class="right">
                <h2>Choices</h2>

                <div class="options">
                    <button>Option 1</button>
                    <button>Option 2</button>
                    <button>Option 3</button>
                </div>

                <button class="confirm">
                    Confirm Choice
                </button>
            </div>

        </div>

        <a href="bunker.html" class="back">
            Back to Bunker
        </a>

    </div>

</body>
</html>
