
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journal of Events</title>
    <script src="api.js" defer></script>
    <script src="journal.js" defer></script>
    <link rel="stylesheet" href="/byte-jam2026/css/journal.css">
</head>

<body>

    <div class="container">

        <h1>Journal of Events</h1>

        <div class="journal">

            <div class="left">


                <p class="description">
                    Your event description will go here.
                    This is where players will read
                    what is happening in the bunker.
                </p>

                <div class="options">
                    <button>Option 1</button>
                    <button>Option 2</button>
                    <button>Option 3</button>
                </div>

                <button class="confirm">
                    Confirm Choice
                </button>

            </div>

            <div class="right">

                <h2>Options</h2>

                <p>Option 1 Description</p>
                <p>Option 2 Description</p>
                <p>Option 3 Description</p>

                <button class="back">
                    Back to Bunker
                </button>

            </div>

        </div>

    </div>

</body>
</html>
