<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Setup Your Playthrough</title>
    <script src="JavascriptForFrontend/api.js" defer></script>
    <script src="C:\Users\tinke\Desktop\ByteJam\DSMerge\byte-jam2026\JavascriptForFrontend\introScreen.js" defer></script>
    <link rel="stylesheet" href="C:\Users\tinke\Desktop\ByteJam\DSMerge\byte-jam2026\introScreen.css" />
  </head>
  <body>
    <button class="mainMenu">
      <a href="/byte-jam2026/index.html">&larr;Main Menu</a>
    </button>
    <h1>Choose your difficulty!</h1>
    <div class="difficultyButtons">
      <button>Easy</button>
      <button>Medium</button>
      <button>Hard</button>
    </div>

    <div class="creditSelect">
      <p id="credits">Credits - xxx</p>
      <div id="Rations">
        <p>Rations - 1 Credit</p>
        <button>+ 1 Rations</button>
        <button>- 1 Rations</button>
        <p>Water - 1 Credit</p>
        <button>+ 1 Water</button>
        <button>-1 Water</button>
      </div>
      <h2>Other Items:</h2>
      <div id="explore">
        <p>Radio - 5 credits</p>
        <button>Take Radio</button>
        <p>Map - 3 credits</p>
        <button>Take Map</button>
      </div>
      <div id="safety">
        <p>Gas Mask - 2 credits</p>
        <button>Take Gas Mask</button>
        <p>Crowbar - 3 credits</p>
        <button>Take Crowbar</button>
      </div>
      <div id="medical">
        <p>First Aid Kit - 4 credits</p>
        <button>Take First Aid Kit</button>
        <p>Medicine - 2 credits</p>
        <button>Take Medicine</button>
      </div>
    </div>
    <div id="startGame">
      <button>Play</button>
    </div>
  </body>
</html>
